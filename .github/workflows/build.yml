name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  version:
    name: Calculate Version Number
    runs-on: ubuntu-latest

    outputs:
      version_number: ${{ steps.buildnum.outputs.build-number }}
      version_string: ${{ steps.version.outputs.version_string }}

    steps:
      - name: Generate adjusted build number
        id: buildnum
        uses: mlilback/build-number@v1
        with:
          # Current github.run_number is 20
          # 20 + (-19) = 1
          base: -21
          run-id: ${{ github.run_number }}

      - name: Create semantic version
        id: version
        run: |
          echo "version_string=v1.0.${{ steps.buildnum.outputs.build-number }}" >> $GITHUB_OUTPUT

      - name: Show version
        run: |
          echo "Build Number: ${{ steps.buildnum.outputs.build-number }}"
          echo "Version: ${{ steps.version.outputs.version_string }}"

  build-linux:
    needs: version

    name: Build Linux (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-latest
            preset: gcc
            artifact_arch: x86_64

    env:
      DUSK_VERSION: ${{ needs.version.outputs.version_string }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fix apt mirrors
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld openssl \
            libcurl4-openssl-dev zlib1g-dev libglu1-mesa-dev \
            libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev \
            libasound2-dev libpulse-dev libudev-dev libpng-dev \
            libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe \
            libgtk-3-dev libssl-dev libxss-dev libfuse2 \
            libusb-1.0-0-dev libdecor-0-dev \
            libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: |
          cmake --preset x-linux-ci-${{ matrix.preset }} \
            -DDUSK_VERSION=${{ env.DUSK_VERSION }}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{ matrix.preset }}

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Package Linux build
        run: |
          mkdir -p release
          cp build/install/Dusk-*.AppImage release/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.artifact_arch }}
          path: release/*

  build-apple:
    needs: version

    name: Build Apple (${{ matrix.name }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang macOS arm64
            platform: macos
            preset: x-macos-ci-arm64
            artifact_name: macos-arm64

          - name: AppleClang macOS x86_64
            platform: macos
            preset: x-macos-ci-x86_64
            artifact_name: macos-x86_64

    env:
      DUSK_VERSION: ${{ needs.version.outputs.version_string }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust macOS ARM target
        if: endsWith(matrix.preset, 'arm64')
        run: |
          rustup toolchain install stable
          rustup target add aarch64-apple-darwin

      - name: Install Rust macOS x86_64 target
        if: endsWith(matrix.preset, 'x86_64')
        run: |
          rustup toolchain install stable
          rustup target add x86_64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DDUSK_VERSION=${{ env.DUSK_VERSION }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package artifacts
        run: |
          mkdir -p release
          cp -R build/install/Dusk.app release/

          tar -czf dusk-${{ env.DUSK_VERSION }}-${{ matrix.artifact_name }}.tar.gz -C release Dusk.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dusk-${{ env.DUSK_VERSION }}-${{ matrix.artifact_name }}
          path: dusk-${{ env.DUSK_VERSION }}-${{ matrix.artifact_name }}.tar.gz

  build-android:
    needs: version

    name: Build Android (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android arm64
            preset: x-android-ci-arm64
            abi: arm64-v8a
            artifact_arch: arm64
            rust_target: aarch64-linux-android

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"
      DUSK_VERSION: ${{ needs.version.outputs.version_string }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add ${{ matrix.rust_target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DDUSK_VERSION=${{ env.DUSK_VERSION }}

      - name: Build native library
        run: cmake --build --preset ${{ matrix.preset }} --target dusk

      - name: Stage stripped JNI library
        run: |
          ANDROID_STAGE_ABIS="${{ matrix.abi }}" \
          platforms/android/scripts/stage-jni-libs.sh

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Package Android build
        run: |
          mkdir -p release

          cp platforms/android/app/build/outputs/apk/release/app-${{ matrix.abi }}-release-unsigned.apk \
            release/dusk-${{ env.DUSK_VERSION }}-android-${{ matrix.artifact_arch }}.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.artifact_arch }}
          path: release/*

  build-windows:
    needs: version

    name: Build Windows (${{ matrix.name }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64

    env:
      DUSK_VERSION: ${{ needs.version.outputs.version_string }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Override VCPKG_ROOT
        shell: pwsh
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja -y

          vcpkg install freetype:${{ matrix.vcpkg_arch }}-windows-static
          vcpkg install zstd:${{ matrix.vcpkg_arch }}-windows-static

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset x-windows-ci-${{ matrix.preset }} "-DDUSK_VERSION=${{ env.DUSK_VERSION }}"

      - name: Build
        shell: pwsh
        run: cmake --build --preset x-windows-ci-${{ matrix.preset }}

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Compress-Archive `
            -Path build/install/* `
            -DestinationPath release/dusk-${{ env.DUSK_VERSION }}-windows-${{ matrix.artifact_arch }}.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.artifact_arch }}
          path: release/*

  release:
    name: Create Auto Release

    needs:
      - version
      - build-linux
      - build-apple
      - build-android
      - build-windows

    runs-on: ubuntu-latest

    env:
      DUSK_VERSION: ${{ needs.version.outputs.version_string }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show files
        run: find dist -type f

      - name: Set version
        run: echo "VERSION=${{ env.DUSK_VERSION }}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DUSK_VERSION }}
          name: Dusk ${{ env.DUSK_VERSION }}
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.tar.xz
            dist/**/*.tar.gz
            dist/**/*.apk
            dist/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
