name: Build

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:

env:
  DUSK_VERSION: ${{ github.ref_name }}
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build-linux:
    name: Build Linux (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-latest
            preset: gcc
            artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev libasound2-dev \
            libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev libssl-dev \
            libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Configure CMake
        run: |
          cmake --preset x-linux-ci-${{matrix.preset}} \
          -DDUSK_VERSION=${{env.DUSK_VERSION}}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{matrix.preset}}

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Package Linux build
        run: |
          mkdir -p release
          cp build/install/Dusk-*.AppImage release/
          tar -cJf release/dusk-${{env.DUSK_VERSION}}-linux-${{matrix.artifact_arch}}-debug.tar.xz build/install/debug.tar.*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dusk-${{env.DUSK_VERSION}}-linux-${{matrix.artifact_arch}}
          path: release/*

  build-apple:
    name: Build Apple (${{matrix.name}})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang macOS arm64
            platform: macos
            preset: x-macos-ci-arm64
            artifact_name: macos-appleclang-arm64

          - name: AppleClang macOS x86_64
            platform: macos
            preset: x-macos-ci-x86_64
            artifact_name: macos-appleclang-x86_64

          - name: AppleClang iOS arm64
            platform: ios
            preset: x-ios-ci
            artifact_name: ios-appleclang-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust iOS target
        if: matrix.platform == 'ios'
        run: |
          rustup toolchain install stable
          rustup target add aarch64-apple-ios

      - name: Install Rust x86_64 macOS target
        if: endsWith(matrix.preset, 'x86_64')
        run: |
          rustup toolchain install stable
          rustup target add x86_64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: |
          cmake --preset ${{matrix.preset}} \
          -DDUSK_VERSION=${{env.DUSK_VERSION}}

      - name: Build
        run: cmake --build --preset ${{matrix.preset}}

      - name: Package Apple build
        run: |
          mkdir -p release

          if [ "${{matrix.platform}}" = "macos" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              build/install/Dusk.app \
              release/dusk-${{env.DUSK_VERSION}}-${{matrix.artifact_name}}.zip
          fi

          if [ -f build/install/debug.tar.xz ]; then
            cp build/install/debug.tar.xz release/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dusk-${{env.DUSK_VERSION}}-${{matrix.artifact_name}}
          path: release/*

  build-android:
    name: Build Android (${{matrix.name}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang arm64-v8a
            preset: x-android-ci-arm64
            abi: arm64-v8a
            artifact_arch: arm64
            rust_target: aarch64-linux-android

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add ${{matrix.rust_target}}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: |
          cmake --preset ${{matrix.preset}} \
          -DDUSK_VERSION=${{env.DUSK_VERSION}}

      - name: Build native library
        run: cmake --build --preset ${{matrix.preset}} --target dusk

      - name: Stage stripped JNI library
        run: |
          ANDROID_STAGE_ABIS="${{matrix.abi}}" \
          platforms/android/scripts/stage-jni-libs.sh

      - name: Build APK
        working-directory: platforms/android
        run: ./gradlew :app:assembleRelease --rerun-tasks

      - name: Package Android build
        run: |
          mkdir -p release
          cp platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release-unsigned.apk \
             release/dusk-${{env.DUSK_VERSION}}-android-${{matrix.artifact_arch}}.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dusk-${{env.DUSK_VERSION}}-android-${{matrix.artifact_arch}}
          path: release/*

  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            runner: windows-latest
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies
        run: |
          choco install ninja
          vcpkg install freetype:${{matrix.vcpkg_arch}}-windows-static zstd:${{matrix.vcpkg_arch}}-windows-static

      - name: Configure CMake
        run: |
          cmake --preset x-windows-ci-${{matrix.preset}} `
          -DDUSK_VERSION=${{env.DUSK_VERSION}}

      - name: Build
        run: cmake --build --preset x-windows-ci-${{matrix.preset}}

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release

          Compress-Archive `
            -Path build/install/* `
            -DestinationPath release/dusk-${{env.DUSK_VERSION}}-windows-${{matrix.artifact_arch}}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dusk-${{env.DUSK_VERSION}}-windows-${{matrix.artifact_arch}}
          path: release/*

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-apple
      - build-android
      - build-windows

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files
        run: find dist -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Dusk ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.tar.xz
            dist/**/*.apk
            dist/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
